<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DormLoop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Rubik:wght@600;700&display=swap">
<style>
/* Layout: a phone-width app column, centered; on wide screens an intro panel sits beside it. Single light look by design. */
:root{
  --teal:#0B9B8A; --teal-deep:#087A6D; --pink:#F596A1; --pink-deep:#D9667A; --pink-soft:#FADEEB;
  --blue:#C4E1F6; --yellow:#F9C975; --mint:#D9F1EE; --cream:#FDEBC8;
  --ink:#1E2A3A; --ink-2:#3D4652; --muted:#5B6470; --line:#E5EAEA;
  --bg:#F6F8F8; --page:#E9EEEE; --card:#FFFFFF; --soft:#EEF2F2; --chip:#DDE4E4; --on-teal:#D7F0EC;
  --night:#14171B; --night-2:#23272D; --night-line:#3B4048;
  --font:'Noto Sans TC',system-ui,-apple-system,'PingFang TC','Microsoft JhengHei',sans-serif;
  --logo:'Rubik','Noto Sans TC',system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--page);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased}
button,input,select{font-family:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.shell{height:100%;display:flex;justify-content:center;gap:56px;align-items:stretch}
.intro{display:none}
.app{width:100%;max-width:440px;height:100%;background:var(--bg);display:flex;flex-direction:column;position:relative;overflow:hidden}
@media (min-width:900px){
  .shell{padding-block:24px;align-items:center}
  .app{height:min(880px,100%);border-radius:32px;box-shadow:0 24px 60px rgba(30,42,58,.18);border:6px solid var(--ink)}
  .intro{display:flex;flex-direction:column;gap:20px;max-width:360px}
}
.intro h1{font-family:var(--logo);font-size:56px;margin:0;line-height:1}
.intro h1 span,.logo span{color:var(--teal)}
.intro p{margin:0;font-size:18px;line-height:1.7;color:var(--ink-2)}
.intro ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.intro li{display:flex;gap:12px;align-items:center;font-size:16px;font-weight:700}
.intro li i{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;font-style:normal;flex-shrink:0}
.intro small{font-size:13px;color:var(--muted)}

/* chrome */
.bar{height:56px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 12px 0 16px;background:var(--card);border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:8px;font-family:var(--logo);font-size:22px;font-weight:700}
.logo b{width:30px;height:30px;border-radius:9px;background:var(--teal);color:#fff;display:grid;place-items:center}
.bar h2{margin:0;font-size:16px;font-weight:700}
.icon-btn{width:44px;height:44px;border:0;background:transparent;display:grid;place-items:center;border-radius:12px}
.scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;position:relative}
.nav{height:72px;flex-shrink:0;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);align-items:center;padding-bottom:env(safe-area-inset-bottom,0px)}
.nav button{height:60px;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;color:var(--muted)}
.nav button[aria-current="page"]{color:var(--teal-deep);font-weight:700}
.nav .sell{margin-top:-24px;color:var(--teal-deep);font-weight:700;height:auto}
.nav .sell span{width:56px;height:56px;border-radius:28px;background:var(--teal);color:#fff;display:grid;place-items:center;border:4px solid var(--card);box-shadow:0 4px 12px rgba(11,155,138,.35)}

/* home */
.locbox{background:var(--card);padding:4px 16px 12px;display:flex;flex-direction:column;gap:10px;position:relative}
.locrow{display:flex;align-items:center;justify-content:space-between}
.loc{min-height:44px;border:0;background:transparent;padding:0;display:flex;align-items:center;gap:4px;font-size:15px;font-weight:700}
.loc svg.chev{transition:transform .2s}
.loc[aria-expanded="true"] svg.chev{transform:rotate(180deg)}
.verified{display:flex;align-items:center;gap:4px;font-size:12px;font-weight:700;color:var(--teal-deep);background:var(--mint);padding:4px 10px;border-radius:999px}
.drop{position:absolute;top:48px;left:16px;width:230px;z-index:5;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 28px rgba(30,42,58,.18);padding:6px;display:flex;flex-direction:column}
.drop button{min-height:44px;border:0;border-radius:10px;background:transparent;text-align:left;padding:0 12px;font-size:15px;display:flex;align-items:center;justify-content:space-between}
.drop button[aria-selected="true"]{background:var(--mint);font-weight:700}
.drop small{font-size:12px;color:var(--muted)}
.search{height:42px;display:flex;align-items:center;gap:8px;padding:0 14px;border-radius:12px;background:var(--soft);color:var(--muted)}
.search input{flex:1;min-width:0;border:0;background:transparent;font-size:15px;outline:none;color:var(--ink)}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);background:var(--card);border-bottom:1px solid var(--line)}
.tabs button{height:44px;border:0;background:transparent;font-size:15px;color:var(--muted)}
.tabs button[aria-pressed="true"]{color:var(--ink);font-weight:700;box-shadow:inset 0 -3px 0 var(--teal)}
.hero{margin:16px 16px 0;border-radius:18px;background:var(--teal-deep);color:#fff;padding:20px;position:relative;overflow:hidden;display:flex;flex-direction:column;gap:6px;min-height:168px}
.hero .tag{align-self:flex-start;font-size:12px;font-weight:700;background:var(--yellow);padding:3px 10px;border-radius:999px}
.hero h3{margin:2px 0 0;font-size:22px;line-height:1.3;font-weight:900;text-wrap:balance;max-width:220px}
.hero .tag{color:var(--ink)}
.hero p{margin:0;font-size:13px;color:var(--on-teal)}
.hero button{margin-top:6px;align-self:flex-start;height:40px;padding:0 16px;border-radius:999px;border:0;background:#fff;color:var(--teal-deep);font-size:14px;font-weight:700}
.hero svg.art{position:absolute;right:6px;bottom:0}
.promos{margin:16px 16px 0;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.promos button{height:108px;border:1px solid var(--line);background:var(--card);padding:12px;border-radius:14px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;font-size:15px;font-weight:900;line-height:1.3;color:var(--ink)}
.promos i{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--ink)}
.chips{margin-top:18px;padding:0 16px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex-shrink:0;min-height:40px;padding:0 14px;border-radius:999px;border:1.5px solid var(--chip);background:var(--card);font-size:14px;font-weight:700;display:flex;align-items:center;gap:6px}
.chips button[aria-pressed="true"],.slots button[aria-pressed="true"],.condpick button[aria-pressed="true"]{background:var(--teal-deep);border-color:var(--teal-deep);color:#fff}
.sechead{margin:20px 16px 10px;display:flex;align-items:baseline;justify-content:space-between}
.sechead h3{margin:0;font-size:18px;font-weight:900}
.sechead span{font-size:13px;color:var(--muted)}
.grid{margin:0 16px 24px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.card{position:relative;border-radius:14px;background:var(--card);overflow:hidden}
.card .open{width:100%;border:0;padding:0;background:transparent;text-align:left;display:flex;flex-direction:column}
.thumb{width:100%;display:grid;place-items:center;color:var(--muted);position:relative}
.cond{position:absolute;top:8px;left:8px;font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px}
.c-new{background:var(--mint);color:var(--teal-deep)}
.c-used{background:var(--blue);color:#1E4A6E}
.c-worn{background:var(--pink-soft);color:#A3324A}
.card .meta{padding:10px 12px 12px;display:flex;flex-direction:column;gap:3px}
.name{font-size:14px;font-weight:700;line-height:1.35}
.sub{font-size:12px;color:var(--muted)}
.price{font-size:16px;font-weight:900;color:var(--teal-deep);font-variant-numeric:tabular-nums}
.heart{position:absolute;top:4px;right:4px;width:40px;height:40px;border:0;border-radius:20px;background:rgba(255,255,255,.92);display:grid;place-items:center;color:var(--ink)}
.heart[aria-pressed="true"]{color:var(--pink-deep)}
.heart[aria-pressed="true"] path{fill:var(--pink)}
.empty{margin:8px 16px 0;padding:28px 16px;text-align:center;background:var(--card);border-radius:14px;font-size:14px;line-height:1.7;color:var(--muted)}

/* lists */
.pad{padding:16px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:14px;padding:10px}
.row .open{flex:1;min-width:0;border:0;background:transparent;padding:0;display:flex;align-items:center;gap:12px;text-align:left}
.sq{flex-shrink:0;border-radius:10px;display:grid;place-items:center;color:var(--muted)}
.col{display:flex;flex-direction:column;gap:3px;min-width:0}
.pill{align-self:flex-start;font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px}
.thread{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--line)}
.avatar{width:44px;height:44px;flex-shrink:0;border-radius:22px;display:grid;place-items:center;font-weight:700;color:var(--ink)}
.thread .top{display:flex;justify-content:space-between;font-size:14px;font-weight:700}
.thread .top small{font-weight:400;color:var(--muted);font-size:12px}
.profile{display:flex;align-items:center;gap:12px}
.profile .avatar{width:52px;height:52px;border-radius:26px;background:var(--teal);color:#fff;font-size:20px}
.countdown{background:var(--teal-deep);color:#fff;border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:6px}
.countdown strong{font-family:var(--logo);font-size:30px}
.countdown span{font-size:13px;color:var(--on-teal)}
.btn{min-height:48px;border:0;border-radius:14px;font-size:15px;font-weight:700;padding:0 16px}
.btn-main{background:var(--teal-deep);color:#fff}
.btn-yellow{background:var(--yellow);color:var(--ink)}
.btn-blue{background:var(--blue);color:var(--ink)}
.btn-line{background:var(--card);border:1.5px solid var(--ink);color:var(--ink)}
.linkrow{min-height:52px;border:0;border-radius:14px;background:var(--card);padding:0 16px;display:flex;align-items:center;justify-content:space-between;font-size:15px;font-weight:700}
.linkrow small{font-weight:400;color:var(--muted);font-size:13px}
h4{margin:4px 0 0;font-size:16px;font-weight:900}

/* detail */
.detail-img{height:260px;display:grid;place-items:center;color:var(--muted);position:relative}
.detail-img small{position:absolute;bottom:12px;right:12px;font-size:12px;color:#fff;background:rgba(30,42,58,.7);padding:3px 10px;border-radius:999px}
.detail h1{margin:0;font-size:20px;font-weight:900}
.detail .price{font-size:24px}
.detail p{margin:0;font-size:14px;line-height:1.7;color:var(--ink-2)}
.box{background:var(--card);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.box b{font-size:14px}
.box small{font-size:12px;color:var(--muted)}
.slots{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.slots button{min-height:44px;border-radius:12px;border:1.5px solid var(--chip);background:var(--card);font-size:14px;font-weight:700}
.cta{flex-shrink:0;padding:12px 16px calc(16px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--line);display:flex;gap:10px}
.cta .heart{position:static;width:52px;height:52px;border-radius:14px;border:1.5px solid var(--chip);background:var(--card)}
.cta .btn{flex:1;height:52px;font-size:16px}

/* orders */
.order{background:var(--card);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px}
.code{display:flex;gap:8px}
.code span{width:48px;height:56px;border-radius:10px;background:var(--soft);font-family:var(--logo);font-size:28px;font-weight:700;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.order.done .code span{color:var(--muted)}
.steps{display:flex;justify-content:space-between}
.steps span{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:700;color:#8A919B}
.steps span i{width:16px;height:16px;border-radius:8px;background:var(--line)}
.steps span.on{color:var(--teal-deep)}
.steps span.on i{background:var(--teal)}

/* camera (simulated) */
.night{background:var(--night);color:#fff}
.night .bar{background:var(--night);border-color:var(--night-2)}
.night .icon-btn{color:#fff}
.shotsteps{margin:0;padding:4px 16px 12px;list-style:none;display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.shotsteps li{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:#B4BAC3}
.shotsteps button{width:56px;height:56px;border-radius:12px;border:1.5px solid var(--night-line);background:var(--night-2);color:#8A919B;display:grid;place-items:center;position:relative;padding:0}
.shotsteps button.cur{border:2px solid var(--teal);background:rgba(11,155,138,.25);color:#fff}
.shotsteps button.ok{border-color:var(--teal);background:#0E3A35;color:#fff}
.shotsteps button.ok::after{content:"✓";position:absolute;right:-5px;top:-5px;width:20px;height:20px;border-radius:10px;background:var(--teal);color:#fff;font-size:12px;font-weight:900;display:grid;place-items:center;border:2px solid var(--night)}
.shotsteps li.cur{color:#fff;font-weight:700}
.finder{margin:0 16px;flex:1;min-height:340px;border-radius:20px;background:#2A2E34;position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center}
.finder .label{margin-top:16px;display:flex;align-items:center;gap:6px;background:rgba(20,23,27,.75);padding:8px 14px;border-radius:999px;font-size:14px;font-weight:700}
.finder .label em{font-style:normal;font-size:12px;color:var(--ink);background:var(--yellow);padding:2px 8px;border-radius:999px}
.finder svg.ghost{margin-top:18px;flex:1;max-height:260px;width:70%}
.finder p{margin:12px 24px 54px;font-size:14px;line-height:1.6;text-align:center;color:#E3E6EA}
.corner{position:absolute;width:28px;height:28px;border-color:#fff;border-style:solid;border-width:0}
.c1{top:14px;left:14px;border-top-width:3px;border-left-width:3px;border-top-left-radius:8px}
.c2{top:14px;right:14px;border-top-width:3px;border-right-width:3px;border-top-right-radius:8px}
.c3{bottom:14px;left:14px;border-bottom-width:3px;border-left-width:3px;border-bottom-left-radius:8px}
.c4{bottom:14px;right:14px;border-bottom-width:3px;border-right-width:3px;border-bottom-right-radius:8px}
.finder .dist{position:absolute;bottom:20px;font-size:12px;background:rgba(20,23,27,.75);padding:4px 10px;border-radius:999px}
.flash{animation:flash .25s ease-out}
@keyframes flash{from{background:#fff}to{background:#2A2E34}}
@media (prefers-reduced-motion:reduce){.flash{animation:none}.loc svg.chev{transition:none}}
.shutterbar{height:120px;flex-shrink:0;display:grid;grid-template-columns:repeat(3,1fr);align-items:center;padding:0 24px env(safe-area-inset-bottom,0px)}
.shutter{justify-self:center;width:76px;height:76px;border-radius:38px;border:4px solid #fff;background:transparent;padding:4px}
.shutter span{display:block;width:100%;height:100%;border-radius:50%;background:#fff}
.skip{justify-self:end;min-height:44px;border:0;background:transparent;color:#D5DBE3;font-size:14px}
.donebox{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:0 28px;text-align:center}
.donebox .ok{width:72px;height:72px;border-radius:36px;background:var(--teal);display:grid;place-items:center}
.donebox h3{margin:0;font-size:22px}
.donebox p{margin:0;font-size:14px;line-height:1.7;color:#D5DBE3}

/* review form */
.field{display:flex;flex-direction:column;gap:6px}
.field label,.field .lbl{font-size:13px;color:var(--muted);font-weight:500}
.field input,.field select{height:46px;border-radius:12px;border:1.5px solid var(--chip);background:var(--card);padding:0 12px;font-size:16px}
.field small{font-size:12px;color:var(--muted)}
.aibanner{display:flex;gap:8px;align-items:center;background:#FEF3D9;border-radius:12px;padding:10px 12px;font-size:13px;font-weight:700}
.photos{display:flex;gap:8px}
.photos span{width:64px;height:64px;border-radius:12px;display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--ink)}
.condpick{display:flex;gap:8px;flex-wrap:wrap}
.condpick button{min-height:40px;padding:0 14px;border-radius:999px;border:1.5px solid var(--chip);background:var(--card);font-size:14px;font-weight:700}

.dealbtn{margin-top:6px;min-height:48px;border:0;border-radius:14px;background:var(--yellow);color:var(--ink);font-size:15px;font-weight:700;padding:0 16px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.countdown .dealbtn span{color:var(--ink);font-size:15px}
.countdown .dealmenu span{color:inherit;font-size:15px}
.dealbtn svg{transition:transform .2s}
.dealbtn[aria-expanded="true"] svg{transform:rotate(180deg)}
.dealmenu{background:var(--card);color:var(--ink);border-radius:14px;padding:6px;display:flex;flex-direction:column;box-shadow:0 8px 20px rgba(30,42,58,.18)}
.dealmenu button{min-height:44px;border:0;border-radius:10px;background:transparent;text-align:left;padding:0 12px;font-size:15px;display:flex;align-items:center;justify-content:space-between}
.dealmenu button[aria-checked="true"]{background:var(--mint);font-weight:700;color:var(--teal-deep)}
.dealmenu .cancel{color:#A3324A;border-top:1px solid var(--line);border-radius:0 0 10px 10px}
.countdown .suggest{display:flex;align-items:center;justify-content:space-between;gap:10px;background:rgba(255,255,255,.14);border-radius:12px;padding:8px 8px 8px 12px}
.countdown .suggest span{font-size:13px;color:#fff;font-weight:700}
.countdown .suggest button{min-height:36px;border:0;border-radius:9px;background:#fff;color:var(--teal-deep);font-weight:700;font-size:13px;padding:0 14px;flex-shrink:0}
.sugtag{font-style:normal;font-size:12px;font-weight:700;color:var(--ink);background:var(--yellow);padding:2px 8px;border-radius:999px;margin-left:6px}
.storage{background:var(--card);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;border:1.5px dashed var(--chip)}
.storage .spot{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--soft);border-radius:12px;padding:10px 12px}
.storage .spot button{min-height:40px;border:0;border-radius:10px;background:var(--teal-deep);color:#fff;font-weight:700;font-size:14px;padding:0 14px;flex-shrink:0}
.methods{display:flex;flex-direction:column;gap:8px}
.method{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--chip);border-radius:14px;padding:12px 14px;min-height:64px}
.method[aria-pressed="true"]{border-color:var(--teal-deep);background:#F2FAF8}
.method .radio{width:20px;height:20px;border-radius:50%;border:2px solid var(--chip);flex-shrink:0;box-sizing:border-box}
.method[aria-pressed="true"] .radio{border:6px solid var(--teal-deep)}
.method b{font-size:15px}
.settings{background:var(--card);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.settings .lbl{font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px}
.seg{display:flex;background:var(--soft);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;min-height:40px;border:0;border-radius:9px;background:transparent;font-weight:700;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--teal-deep);box-shadow:0 1px 3px rgba(30,42,58,.14)}
.toast{position:absolute;left:50%;bottom:92px;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:14px;font-weight:700;padding:10px 18px;border-radius:999px;white-space:nowrap;box-shadow:0 6px 18px rgba(30,42,58,.3);z-index:20}
</style>
</head>
<body>

<div class="shell">
  <aside class="intro" id="intro"></aside>
  <div class="app" id="app"></div>
</div>

<script>
(function(){

function render(){
  const t=T();
  document.documentElement.lang=t.html;
  const key=S.view||S.tab;
  const prev=app.querySelector('.scroll');const keep=(key===lastKey&&prev)?prev.scrollTop:0;
  let html;
  if(S.view==='detail') html=detail();
  else if(S.view==='orders') html=orders();
  else if(S.view==='sell') html=sell();
  else if(S.view==='review') html=review();
  else{
    const title={home:'',saved:t.title_saved,msg:t.title_msg,me:t.title_me}[S.tab];
    const body={home:home,saved:saved,msg:msgs,me:me}[S.tab]();
    html=topBar(title)+`<div class="scroll">${body}</div>`+navBar();
  }
  app.innerHTML=html+'<div class="toast" role="status" hidden></div>';
  const sc=app.querySelector('.scroll');if(sc)sc.scrollTop=keep;
  lastKey=key;
}

app.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');
  if(!el){ if(S.drop){S.drop=false;render();} return; }
  const act=el.dataset.act, id=el.dataset.id, t=T();
  if(act!=='drop') S.drop=false;
  switch(act){
    case 'nav': S.tab=id;S.view=null;break;
    case 'drop': S.drop=!S.drop;break;
    case 'bld': S.building=+id;break;
    case 'htab': S.homeTab=+id;break;
    case 'cat': S.cat=id;break;
    case 'samefloor': S.building=1;S.cat='all';S.homeTab=0;render();toast(t.t_same);return;
    case 'salepromo': S.building=0;S.cat='all';S.homeTab=2;render();toast(t.t_sale);return;
    case 'open': S.view='detail';S.itemId=+id;S.slot=0;S.method='room';lastKey='';break;
    case 'method': S.method=id;S.slot=0;break;
    case 'save': {const n=+id;const on=isSaved(n);S.saved=on?S.saved.filter(x=>x!==n):S.saved.concat(n);render();toast(on?t.t_unsaved:t.t_saved);return;}
    case 'back': S.view=(S.view==='review')?'sell':null;break;
    case 'slot': S.slot=+id;break;
    case 'book': {const it=byId(S.itemId);if(S.orders.some(o=>o.itemId===it.id)){S.view='orders';break;}
      const sk=S.method==='room'?'room_slots':'slots';S.orders=[{id:'o'+Date.now(),itemId:it.id,method:S.method,when:{zh:L.zh[sk][S.slot],en:L.en[sk][S.slot]},status:0}].concat(S.orders);S.view='orders';render();toast(t.t_booked);return;}
    case 'orders': S.view='orders';break;
    case 'adv': {const o=S.orders.find(x=>x.id===id);o.status++;render();toast(o.status===1?t.t_conf:t.t_done);return;}
    case 'dealmenu': S.dealOpen=!S.dealOpen;break;
    case 'deal': {S.dealOpen=false;
      if(id==='cancel'){S.deal=null;render();toast(t.t_bundle_off);return;}
      if(id==='storage'){S.deal='storage';break;}
      S.deal=+id;const lbl=t.deal_opts.find(o=>o[0]===id)[1];render();toast(t.t_deal(lbl));return;}
    case 'storebook': toast(t.t_storage);return;
    case 'lang': {if(S.lang===id)return;S.lang=id;try{localStorage.setItem('dormloop-lang',id);}catch(err){}intro();render();toast(T().t_lang);return;}
    case 'sell': S.view='sell';S.shot=0;S.shots=[0,0,0,0,0];break;
    case 'pickshot': S.shot=+id;break;
    case 'shoot': {S.shots[S.shot]=1;let n=S.shot+1;while(n<NSHOTS&&S.shots[n])n++;S.shot=n;S.flash=true;render();S.flash=false;return;}
    case 'skipshot': {let n=S.shot+1;while(n<NSHOTS&&S.shots[n])n++;S.shot=n;break;}
    case 'reshoot': S.shot=0;S.shots=[0,0,0,0,0];break;
    case 'toreview': S.draft={name:t.draft_name,cat:'cabinet',cond:'used',price:300};S.view='review';break;
    case 'cond': S.draft.cond=id;break;
  }
  render();
});

app.addEventListener('submit',e=>{
  e.preventDefault();
